<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7fb">
<link rel="manifest" href="manifest.json">
<title>あやせスタディ</title>
<style>
:root{--ink:#202435;--muted:#73798a;--line:#e4e6ed;--paper:#fff;--bg:#f5f6fa;--accent:#5267d8;--soft:#edf0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:13px;padding:13px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#eef0f5;color:var(--ink)}
button.danger{background:#fff0f0;color:#a52c36}
button:disabled{opacity:.4;cursor:not-allowed}
header{padding:18px 18px 12px;display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:auto}
h1{font-size:22px;margin:0}
main{max-width:760px;margin:auto;padding:8px 16px 40px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 2px 8px #20243508}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:white;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid #cbd2ff;border-color:var(--accent)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
.test-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:white}
.test-card strong{display:block;margin-bottom:4px}
.test-card .actions{display:flex;gap:6px}
.test-card button{padding:9px 11px;font-size:13px}
.question-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}
.question-row button{padding:10px 12px}
#writing{width:100%;height:245px;border:2px dashed #cfd3df;border-radius:15px;background:#fff;touch-action:none;display:block}
.prompt{font-size:clamp(38px,9vw,58px);font-weight:800;text-align:center;padding:18px 0 24px;letter-spacing:.08em}
.answer{font-size:clamp(34px,8vw,48px);font-weight:800;text-align:center;color:var(--accent);padding:12px}
.progress{height:7px;background:#eceef4;border-radius:10px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--accent);width:0}
.hidden{display:none!important}
.notice{background:#f2f5ff;border-radius:12px;padding:12px;font-size:13px;color:#47538e}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){.question-row{grid-template-columns:1fr 1fr}.question-row button{grid-column:span 2}.test-card{align-items:flex-start}.test-card .actions{flex-direction:column}}
</style>
</head>
<body>
<header><h1>あやせスタディ</h1><button class="secondary" id="homeBtn">テスト一覧</button></header>
<main>
<section id="home">
  <div class="panel">
    <div class="row between"><h2>テストを選ぶ</h2><button id="newTestBtn">＋ 新しいテスト</button></div>
    <p class="muted">テストを選ぶと、登録した問題からランダムに10問出題します。</p>
    <div id="testList" class="stack"></div>
  </div>
  <div class="notice">問題と答えは、この端末のブラウザ内に保存されます。ブラウザのデータを消去すると登録内容も消えるため、必要に応じてバックアップを利用してください。</div>
</section>

<section id="editor" class="hidden">
  <div class="panel stack">
    <h2 id="editorHeading">テストを作る</h2>
    <div><label for="testName">テスト名</label><input id="testName" maxlength="40" placeholder="例：たし算、カタカナ、九九"></div>
    <div class="row between"><h3>問題と答え</h3><span class="muted" id="questionCount"></span></div>
    <div id="questionEditor" class="stack"></div>
    <button class="secondary" id="addQuestionBtn">＋ 問題を追加</button>
    <div class="row"><button id="saveTestBtn">保存する</button><button class="secondary" id="cancelEditBtn">キャンセル</button></div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="panel">
    <div class="row between"><strong id="quizTitle"></strong><span id="quizCount" class="muted"></span></div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="muted" style="text-align:center">問題の答えを書こう</div>
    <div id="prompt" class="prompt"></div>
    <canvas id="writing"></canvas>
    <div class="row between" style="margin-top:10px">
      <button class="secondary" id="clearBtn">消す</button>
      <button class="secondary" id="showAnswerBtn">答えを見る</button>
    </div>
    <div id="answerArea" class="hidden">
      <div class="muted" style="text-align:center;margin-top:16px">答え</div>
      <div id="answerText" class="answer"></div>
    </div>
    <div class="row between" style="margin-top:16px">
      <button class="secondary" id="quitQuizBtn">終了</button>
      <button id="nextBtn">次の問題</button>
    </div>
  </div>
</section>

<section id="finish" class="hidden">
  <div class="panel stack" style="text-align:center">
    <h2>テスト終了！</h2>
    <p>10問おつかれさまでした。</p>
    <button id="againBtn">もう一度挑戦</button>
    <button class="secondary" id="finishHomeBtn">テスト一覧へ</button>
  </div>
</section>
</main>
<footer>あやせスタディ · 端末内保存</footer>
<script>
const KEY='ayase-study-tests-v1';
const sample=[
 {id:'sample-kana',name:'カタカナ練習',questions:[['あさ','アサ'],['いぬ','イヌ'],['うみ','ウミ'],['えき','エキ'],['おに','オニ'],['かさ','カサ'],['くるま','クルマ'],['さかな','サカナ'],['すいか','スイカ'],['ねこ','ネコ']]},
 {id:'sample-math',name:'たし算',questions:[['3＋5','8'],['7＋2','9'],['4＋4','8'],['6＋3','9'],['2＋5','7'],['8＋1','9'],['5＋5','10'],['9＋2','11'],['6＋6','12'],['7＋4','11']]}
];
let tests=loadTests(), editingId=null, currentSet=null, quizQuestions=[], quizIndex=0, lastSetId=null;
const $=id=>document.getElementById(id);
function loadTests(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:sample.map(x=>structuredClone(x))}catch(e){return sample.map(x=>structuredClone(x))}}
function persist(){localStorage.setItem(KEY,JSON.stringify(tests))}
function show(which){['home','editor','quiz','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==which));$('homeBtn').classList.toggle('hidden',which==='home')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHome(){
 $('testList').innerHTML='';
 if(!tests.length){$('testList').innerHTML='<p class="muted">まだテストがありません。「新しいテスト」から作成してください。</p>';return}
 tests.forEach(t=>{
  const card=document.createElement('div');card.className='test-card';
  card.innerHTML=`<div><strong>${esc(t.name)}</strong><span class="muted">${t.questions.length}問登録 · 10問ランダム出題</span></div><div class="actions"><button data-start="${esc(t.id)}">開始</button><button class="secondary" data-edit="${esc(t.id)}">編集</button><button class="danger" data-delete="${esc(t.id)}">削除</button></div>`;
  $('testList').appendChild(card);
 });
}
function newRow(q='',a=''){
 const div=document.createElement('div');div.className='question-row';
 div.innerHTML=`<input aria-label="問題" placeholder="問題（例：3＋5）" value="${esc(q)}"><input aria-label="答え" placeholder="答え（例：8）" value="${esc(a)}"><button class="danger" type="button">削除</button>`;
 div.querySelector('button').onclick=()=>{div.remove();updateCount()};
 $('questionEditor').appendChild(div);updateCount();
}
function updateCount(){$('questionCount').textContent=$('questionEditor').children.length+'問'}
function openEditor(test=null){
 editingId=test?.id||null;$('editorHeading').textContent=test?'テストを編集':'新しいテストを作成';$('testName').value=test?.name||'';$('questionEditor').innerHTML='';
 (test?.questions||[['','']]).forEach(x=>newRow(x[0],x[1]));show('editor');
}
function saveEditor(){
 const name=$('testName').value.trim();if(!name){alert('テスト名を入力してください');return}
 const questions=[...$('questionEditor').children].map(r=>[r.children[0].value.trim(),r.children[1].value.trim()]).filter(x=>x[0]&&x[1]);
 if(questions.length<10){alert('ランダムに10問出すため、問題と答えを10組以上登録してください。現在'+questions.length+'組です。');return}
 const item={id:editingId||('t-'+Date.now()),name,questions};
 if(editingId){tests=tests.map(t=>t.id===editingId?item:t)}else tests.push(item);
 persist();renderHome();show('home');
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(id){
 currentSet=tests.find(t=>t.id===id);if(!currentSet)return;
 lastSetId=id;quizQuestions=shuffle(currentSet.questions).slice(0,10);quizIndex=0;show('quiz');drawQuestion();
}
function drawQuestion(){
 const q=quizQuestions[quizIndex];$('quizTitle').textContent=currentSet.name;$('quizCount').textContent=(quizIndex+1)+' / 10問';$('progressBar').style.width=((quizIndex)/10*100)+'%';$('prompt').textContent=q[0];$('answerText').textContent=q[1];$('answerArea').classList.add('hidden');$('nextBtn').textContent=quizIndex===9?'終了':'次の問題';clearCanvas();
}
function finishQuiz(){show('finish')}
const canvas=$('writing'),ctx=canvas.getContext('2d');let drawing=false,hasDrawn=false;
function resizeCanvas(){
 const rect=canvas.getBoundingClientRect();const dpr=Math.max(1,window.devicePixelRatio||1);
 const old=hasDrawn?canvas.toDataURL():null;
 canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#202435';
 if(old){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=old}
}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;hasDrawn=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);hasDrawn=false}
$('newTestBtn').onclick=()=>openEditor();$('addQuestionBtn').onclick=()=>newRow();$('saveTestBtn').onclick=saveEditor;$('cancelEditBtn').onclick=()=>{renderHome();show('home')};
$('testList').addEventListener('click',e=>{
 const start=e.target.dataset.start,edit=e.target.dataset.edit,del=e.target.dataset.delete;
 if(start)startQuiz(start);
 if(edit)openEditor(tests.find(t=>t.id===edit));
 if(del&&confirm('このテストを削除しますか？')){tests=tests.filter(t=>t.id!==del);persist();renderHome()}
});
$('clearBtn').onclick=clearCanvas;$('showAnswerBtn').onclick=()=>$('answerArea').classList.remove('hidden');
$('nextBtn').onclick=()=>{if(quizIndex===9)finishQuiz();else{quizIndex++;drawQuestion()}};
$('quitQuizBtn').onclick=()=>{renderHome();show('home')};
$('againBtn').onclick=()=>startQuiz(lastSetId);$('finishHomeBtn').onclick=()=>{renderHome();show('home')};
$('homeBtn').onclick=()=>{renderHome();show('home')};
window.addEventListener('resize',resizeCanvas);
renderHome();show('home');requestAnimationFrame(resizeCanvas);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
